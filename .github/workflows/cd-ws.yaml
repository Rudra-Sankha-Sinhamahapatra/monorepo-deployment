name : Deploy the websockets backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./docker/Dockerfile.websockets
          push: true
          tags: rudrasankha/user-backend-ws:${{ github.sha }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull rudrasankha/user-backend-ws:${{ github.sha }}
            docker stop user-backend-ws || true
            docker rm user-backend-ws || true
            docker run -d --name user-backend-ws -p 8081:8081 rudrasankha/user-backend-ws:${{ github.sha }}